plugins { id 'com.android.application' }

android {
    namespace 'id.sakuvo.app'
    compileSdk 35

    defaultConfig {
        applicationId 'id.sakuvo.app'
        minSdk 24
        targetSdk 28
        versionCode 2
        versionName '0.4.0-beta'
    }

    sourceSets {
        main {
            manifest.srcFile '../AndroidManifest.xml'
            java.srcDirs = ['../src']
            assets.srcDirs = ['../assets']
            res.srcDirs = ['../res']
        }
    }
}
